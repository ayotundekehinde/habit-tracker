<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1>Habit Tracker</h1>
      <p class="subtitle">Sign in to sync your habits across devices</p>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab active" data-tab="login" role="tab" aria-selected="true">Log In</button>
        <button type="button" class="auth-tab" data-tab="register" role="tab" aria-selected="false">Sign Up</button>
      </div>

      <form id="login-form" class="auth-form">
        <label for="login-username">Username</label>
        <input type="text" id="login-username" class="auth-input" autocomplete="username" required minlength="3">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" class="auth-input" autocomplete="current-password" required minlength="6">
        <button type="submit" class="btn btn-primary auth-submit">Log In</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" class="auth-input" autocomplete="username" required minlength="3">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" class="auth-input" autocomplete="new-password" required minlength="6">
        <label for="register-confirm">Confirm Password</label>
        <input type="password" id="register-confirm" class="auth-input" autocomplete="new-password" required minlength="6">
        <button type="submit" class="btn btn-primary auth-submit">Create Account</button>
      </form>

      <p id="auth-error" class="auth-error hidden" role="alert"></p>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="header">
      <div class="header-top">
        <div>
          <h1>Habit Tracker</h1>
          <p class="subtitle">Track your daily progress</p>
        </div>
        <div class="header-actions">
          <span id="user-greeting" class="user-greeting"></span>
          <button type="button" id="logout-btn" class="btn btn-secondary">Log Out</button>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
            <span class="theme-icon" aria-hidden="true">🌙</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="stats-panel" aria-label="Statistics">
        <div class="stat-card">
          <span class="stat-value" id="stat-total">0</span>
          <span class="stat-label">Total Habits</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-completed">0</span>
          <span class="stat-label">Completed Today</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-rate">0%</span>
          <span class="stat-label">Completion Rate</span>
        </div>
      </section>

      <section class="progress-section" aria-label="Daily progress">
        <div class="progress-header">
          <span id="progress-text">Progress: 0 / 0 Habits Completed</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </section>

      <section class="input-section">
        <form id="add-habit-form" class="add-form">
          <input
            type="text"
            id="habit-input"
            class="habit-input"
            placeholder="Enter a habit name..."
            maxlength="80"
            autocomplete="off"
            required
          >
          <select id="category-select" class="category-select" aria-label="Habit category">
            <option value="study">Study</option>
            <option value="fitness">Fitness</option>
            <option value="Monetization">Monetization</option>
            <option value="personal">Personal Development</option>
            <option value="other">Other</option>
          </select>
          <button type="submit" class="btn btn-primary">Add Habit</button>
        </form>
      </section>

      <section class="filter-section">
        <label for="filter-category" class="filter-label">Filter by category:</label>
        <select id="filter-category" class="category-select" aria-label="Filter habits by category">
          <option value="all">All Categories</option>
          <option value="study">Study</option>
          <option value="fitness">Fitness</option>
          <option value="Monetization">Monetization</option>
          <option value="personal">Personal Development</option>
          <option value="other">Other</option>
        </select>
      </section>

      <section class="habits-section">
        <ul id="habit-list" class="habit-list" aria-label="Habit list"></ul>
        <p id="empty-state" class="empty-state">No habits yet. Add one above to get started!</p>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
